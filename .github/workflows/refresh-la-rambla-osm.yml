name: Refresh La Rambla OSM snapshots
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_la_rambla_osm.py'
  workflow_dispatch:
  schedule:
    - cron: '27 4 1 * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate La Rambla OSM geometry
        run: python scripts/update_la_rambla_osm.py
      - name: Commit validated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/la-rambla-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified La Rambla OSM geometry snapshots"
            git push
          fi
